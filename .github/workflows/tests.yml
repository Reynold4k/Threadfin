name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, so that a new release of a dependency that breaks Threadfin is noticed
  workflow_dispatch:

jobs:
  pytest:
    # pip installs pynndescent 0.6 and umap-learn 0.5 on Python 3.10-3.11, pynndescent 0.7 and umap-learn 0.6 from
    # Python 3.12 on (pyproject.toml), so the matrix runs Threadfin's approximate neighbour search with both
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test,seq]"
      - name: Scanpy's own neighbour search, UMAP and Leiden work with the pynndescent installed (users' calls)
        run: python .github/scanpy_neighbours.py
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  other-systems:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  oldest-dependencies:
    # the oldest versions that pyproject.toml allows, so the declared minimum versions stay true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the oldest allowed versions
        run: |
          pip install uv
          uv venv -p 3.10 .venv-oldest
          VIRTUAL_ENV=.venv-oldest uv pip install --resolution lowest-direct -e ".[test]"
      - name: Scanpy's own neighbour search, UMAP and Leiden work with the pynndescent installed (users' calls)
        run: .venv-oldest/bin/python .github/scanpy_neighbours.py
      - name: Run tests
        run: .venv-oldest/bin/python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: .venv-oldest/bin/python examples/tutorial.py

  validated-stack:
    # every package at the version of docs/tutorials/requirements-lock.txt (Python 3.11, pynndescent 0.6.0,
    # umap-learn 0.5.12, scanpy 1.11.5, sc-dandelion 0.5.7, matplotlib 3.8.4), with which the published results were
    # made and are reproduced exactly; Threadfin itself from this checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the locked versions
        run: |
          grep -v -i '^threadfin==' docs/tutorials/requirements-lock.txt > "$RUNNER_TEMP/lock.txt"
          pip install -r "$RUNNER_TEMP/lock.txt" pytest
          pip install --no-deps -e .
          pip check
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  newest-neighbour-search:
    # pynndescent >= 0.7 and umap-learn >= 0.6 on the newest Python, whatever the resolver picks elsewhere: the
    # smoothing above 50,000 cells and the clone map of 4,096 or more clones (tests/test_neighbour_search.py), and
    # Scanpy's own neighbour search with them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install with pynndescent 0.7 and umap-learn 0.6 or later
        run: pip install -e ".[test]" "pynndescent>=0.7" "umap-learn>=0.6"
      - name: Scanpy's own neighbour search, UMAP and Leiden work with the pynndescent installed (users' calls)
        run: python .github/scanpy_neighbours.py
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  dandelion:
    # the README's main path: clones called from receptor contigs with Dandelion, and scirpy input; tests run
    # without PYTHONHASHSEED, so the default path users get (clone calls in a child process with seed 0) is tested
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with Dandelion, and scirpy where it installs
        run: |
          pip install -e ".[test,dandelion]"
          pip install scirpy || echo "::warning::scirpy could not be installed on Python ${{ matrix.python-version }}"
      - name: Dandelion is importable (otherwise its tests would be skipped)
        # the installed version; dandelion.__version__ asks setuptools-scm first and reports the checkout's git state
        run: python -c "import threadfin, dandelion; from importlib.metadata import version; print('sc-dandelion', version('sc-dandelion'), 'matplotlib', version('matplotlib'))"
      - name: scirpy is importable on Python 3.12 (otherwise its test would be skipped)
        if: matrix.python-version == '3.12'
        run: python -c "import scirpy; from importlib.metadata import version; print('scirpy', version('scirpy'))"
      - name: Scanpy's own neighbour search, UMAP and Leiden work with the pynndescent installed (users' calls)
        run: python .github/scanpy_neighbours.py
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      - name: Tutorial on simulated data
        run: python examples/tutorial.py
