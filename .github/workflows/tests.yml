name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, so that a new release of a dependency that breaks Threadfin is noticed
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test,seq]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  other-systems:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  oldest-dependencies:
    # the oldest versions that pyproject.toml allows, so the declared minimum versions stay true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the oldest allowed versions
        run: |
          pip install uv
          uv venv -p 3.10 .venv-oldest
          VIRTUAL_ENV=.venv-oldest uv pip install --resolution lowest-direct -e ".[test]"
      - name: Run tests
        run: .venv-oldest/bin/python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: .venv-oldest/bin/python examples/tutorial.py

  dandelion:
    # the README's main path: clones called from receptor contigs with Dandelion, and scirpy input; tests run
    # without PYTHONHASHSEED, so the default path users get (clone calls in a child process with seed 0) is tested
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with Dandelion, and scirpy where it installs
        run: |
          pip install -e ".[test,dandelion]"
          pip install scirpy || echo "::warning::scirpy could not be installed on Python ${{ matrix.python-version }}"
      - name: Dandelion is importable (otherwise its tests would be skipped)
        # the installed version; dandelion.__version__ asks setuptools-scm first and reports the checkout's git state
        run: python -c "import threadfin, dandelion; from importlib.metadata import version; print('sc-dandelion', version('sc-dandelion'), 'matplotlib', version('matplotlib'))"
      - name: scirpy is importable on Python 3.12 (otherwise its test would be skipped)
        if: matrix.python-version == '3.12'
        run: python -c "import scirpy; from importlib.metadata import version; print('scirpy', version('scirpy'))"
      - name: Run tests
        run: python -m pytest tests/ -q -rs
      - name: Tutorial on simulated data
        run: python examples/tutorial.py
