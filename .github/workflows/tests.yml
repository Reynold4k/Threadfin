name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test,seq]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  other-systems:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: python examples/tutorial.py

  oldest-dependencies:
    # the oldest versions that pyproject.toml allows, so the declared minimum versions stay true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the oldest allowed versions
        run: |
          pip install uv
          uv venv -p 3.10 .venv-oldest
          VIRTUAL_ENV=.venv-oldest uv pip install --resolution lowest-direct -e ".[test]"
      - name: Run tests
        run: .venv-oldest/bin/python -m pytest tests/ -q
      - name: Tutorial on simulated data
        run: .venv-oldest/bin/python examples/tutorial.py
