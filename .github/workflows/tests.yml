name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extras
        run: pip install -e ".[leiden,test]"
      - name: Run tests
        run: python -m pytest tests/ -q
