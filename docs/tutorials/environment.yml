# Environment for the end-to-end tutorial (05_end_to_end_tutorial.ipynb):
#   curl -LO https://raw.githubusercontent.com/Reynold4k/Threadfin/main/docs/tutorials/environment.yml
#   conda env create -f environment.yml
#   conda activate threadfin
#   python -m ipykernel install --user --name threadfin --display-name "Python (threadfin)"
# (clone calls are identical in every session: Threadfin calls Dandelion under hash seed 0)
# Exact versions of the published run: requirements-lock.txt (pip install -r requirements-lock.txt).
name: threadfin
channels:
  - conda-forge
  - nodefaults                # only conda-forge: Anaconda's own channels are neither needed nor searched
dependencies:
  - python=3.11
  - pip
  - pip:
      - threadfin>=4.6.0        # the notebook uses strata_key (4.6.0); pynndescent stays below 0.7 (4.5.3)
      - sc-dandelion==0.5.7
      - matplotlib<3.9          # Dandelion 0.5.7 uses matplotlib.cm.get_cmap, removed in matplotlib 3.9
      - jupyterlab
      - ipykernel
