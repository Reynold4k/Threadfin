# Environment for the end-to-end tutorial (05_end_to_end_tutorial.ipynb):
#   curl -LO https://raw.githubusercontent.com/Reynold4k/Threadfin/main/docs/tutorials/environment.yml
#   conda env create -f environment.yml
#   conda activate threadfin
#   python -m ipykernel install --user --name threadfin --display-name "Python (threadfin)" --env PYTHONHASHSEED 0
# (the fixed hash seed makes Dandelion's clone calls identical run after run; see Step 0 of the notebook)
name: threadfin
channels:
  - conda-forge
  - nodefaults                # only conda-forge: Anaconda's own channels are neither needed nor searched
dependencies:
  - python=3.11
  - pip
  - pip:
      - threadfin>=4.5.3        # 4.5.3 keeps pynndescent below 0.7, whose output scanpy cannot yet read
      - sc-dandelion==0.5.7
      - matplotlib<3.9          # Dandelion 0.5.7 uses matplotlib.cm.get_cmap, removed in matplotlib 3.9
      - jupyterlab
      - ipykernel
