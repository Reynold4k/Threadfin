[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threadfin"
version = "1.0.0"
description = "Transcriptional-state-aware reclustering of B-cell clonotypes from paired scRNA-seq and scBCR-seq data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chen Satoshi", email = "103236530+Reynold4k@users.noreply.github.com" },
]
keywords = ["single-cell", "scRNA-seq", "BCR", "VDJ", "clonotype", "immunology", "germinal-center"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.8",
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "scanpy>=1.9",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.optional-dependencies]
leiden = ["igraph>=0.10", "leidenalg>=0.9"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Reynold4k/Threadfin"
Repository = "https://github.com/Reynold4k/Threadfin"
Issues = "https://github.com/Reynold4k/Threadfin/issues"

[tool.setuptools.packages.find]
include = ["threadfin*"]
