[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threadfin"
version = "4.4.0"
description = "Relationships between B-cell clones from paired single-cell RNA and BCR sequencing: clone embeddings, clonal coherence, clonal programmes, clone-level tests and clonal memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chen Satoshi", email = "103236530+Reynold4k@users.noreply.github.com" },
]
keywords = ["single-cell", "scRNA-seq", "BCR", "VDJ", "B cell", "clone", "clonal lineage",
            "germinal center", "immunology", "repertoire"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.2",                 # parallel clone-map search and programme bootstrap (n_jobs)
    "scanpy>=1.10",
    "matplotlib>=3.7",
    "igraph>=0.10",
    "leidenalg>=0.10",
    "umap-learn>=0.5.5",            # older releases import pkg_resources, absent from new environments
    "pynndescent>=0.5.8",           # likewise
    "harmonypy>=0.0.9",
]

[project.optional-dependencies]
# clone definition with Dandelion; sc-dandelion 0.5.7 uses matplotlib.cm.get_cmap, removed in matplotlib 3.9
dandelion = ["sc-dandelion>=0.5.7", "matplotlib>=3.7,<3.9"]
seq = ["parasail>=1.3"]          # faster CDR3 alignment for the legacy v3 functions
data = ["mudata>=0.3", "awkward>=2"]  # reading scirpy/MuData example data
test = ["pytest>=7", "pytest-cov>=4"]
benchmark = ["clone2vec>=0.1", "psutil>=5"]

[project.urls]
Homepage = "https://github.com/Reynold4k/Threadfin"
Repository = "https://github.com/Reynold4k/Threadfin"
Issues = "https://github.com/Reynold4k/Threadfin/issues"

[tool.setuptools.packages.find]
include = ["threadfin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
